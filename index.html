<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cumbre Comercial — Proteccionismo vs. libre comercio</title>
<meta name="description" content="Simulación interactiva de una cumbre de política comercial: proteccionismo, aranceles y libre comercio en Economía Internacional." />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🏛️</span>
      <span class="brand-name">Cumbre Comercial</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-home" class="icon-btn" title="Volver al inicio" aria-label="Volver al inicio">⌂</button>
      <button id="btn-mute" class="icon-btn" title="Silenciar sonido" aria-label="Silenciar sonido">🔊</button>
    </div>
  </header>

  <main id="app-root"></main>

  <!-- ========== MODAL: reinicio solo para la persona docente ========== -->
  <div id="modal-teacher-login" class="modal-overlay" hidden>
    <div class="modal-box card">
      <h2>Reiniciar tabla global</h2>
      <p class="subtitle">Solo la cuenta docente autorizada puede reiniciar la tabla. Ingresa sus credenciales de Firebase para continuar.</p>
      <label class="field">
        <span>Correo docente</span>
        <input type="email" id="teacher-email" autocomplete="username" placeholder="docente@ucr.ac.cr" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="teacher-password" autocomplete="current-password" />
      </label>
      <p id="teacher-login-error" class="error-text" hidden></p>
      <div class="modal-actions">
        <button id="btn-teacher-cancel" class="btn btn-ghost">Cancelar</button>
        <button id="btn-teacher-confirm" class="btn btn-danger-ghost">Confirmar reinicio</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Simulación gamificada — Economía Internacional · Editable en VS Code · <span id="question-count-footer"></span> mociones en <span id="session-count-footer"></span> sesiones</p>
  </footer>

  <script src="js/questions.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("question-count-footer").textContent =
      SESSIONS.reduce((sum, s) => sum + s.questions.length, 0);
    document.getElementById("session-count-footer").textContent = SESSIONS.length;
  </script>
</body>
</html>
